<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Projeto 1</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }

    .galeria img {
      width: 250px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .galeria img:hover {
      transform: scale(1.05);
    }
  </style>

</head>
<body>

  <h1>Projeto 1</h1>

<div class="galeria">
  <img src="../../imagens/projeto1-1.jpg">
  <img src="../../imagens/projeto1-2.jpg">
  <img src="../../imagens/projeto1-3.jpg">
  <img src="../../imagens/projeto1-4.jpg">
  <img src="../../imagens/projeto1-5.jpg">
  <img src="../../imagens/projeto1-6.jpg">
</div>

</body>
</html>
