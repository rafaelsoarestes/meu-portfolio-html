<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto 3</title>
  <style>
    body { margin: 0; background: #0f172a; color: white; font-family: Arial, sans-serif; text-align: center; }
    main { max-width: 1100px; margin: auto; padding: 30px 20px; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 25px; }
    .galeria img { width: 100%; height: 250px; object-fit: cover; border-radius: 10px; transition: transform .3s; }
    .galeria img:hover { transform: scale(1.04); }
    .visor { display: none; position: fixed; inset: 0; z-index: 5; place-items: center; padding: 24px; background: rgba(0, 0, 0, .88); }
    .visor.aberto { display: grid; }
    .visor img { max-width: min(100%, 1000px); max-height: 85vh; object-fit: contain; border-radius: 10px; }
    .fechar { position: fixed; top: 18px; right: 24px; border: 0; background: transparent; color: white; font-size: 2rem; cursor: pointer; }
    a { display: inline-block; margin-top: 25px; color: #38bdf8; }
  </style>
</head>
<body>
  <main>
    <h1>Projeto 3</h1>
    <div class="galeria">
      <img src="projeto3-1.jpg" alt="Projeto 3 - imagem 1">
      <img src="projeto3-2.jpg" alt="Projeto 3 - imagem 2">
      <img src="projeto3-3.jpg" alt="Projeto 3 - imagem 3">
      <img src="projeto3-4.jpg" alt="Projeto 3 - imagem 4">
      <img src="projeto3-5.jpg" alt="Projeto 3 - imagem 5">
      <img src="projeto3-6.jpg" alt="Projeto 3 - imagem 6">
      <img src="projeto3-7.jpg" alt="Projeto 3 - imagem 7">
      <img src="projeto3-8.jpg" alt="Projeto 3 - imagem 8">
      <img src="projeto3-9.jpg" alt="Projeto 3 - imagem 9">
      <img src="projeto3-10.jpg" alt="Projeto 3 - imagem 10">
      <img src="projeto3-11.jpg" alt="Projeto 3 - imagem 11">
      <img src="projeto3-12.jpg" alt="Projeto 3 - imagem 12">
      <img src="projeto3-13.jpg" alt="Projeto 3 - imagem 13">
    </div>
    <a href="../../index copy 3.html">Voltar ao portfólio</a>
  </main>
  <div class="visor" aria-hidden="true"><button class="fechar" aria-label="Fechar imagem">&times;</button><img alt=""></div>
  <script>
    const visor = document.querySelector('.visor');
    const imagemAmpliada = visor.querySelector('img');
    document.querySelectorAll('.galeria img').forEach((imagem) => imagem.addEventListener('click', () => { imagemAmpliada.src = imagem.src; imagemAmpliada.alt = imagem.alt; visor.classList.add('aberto'); visor.setAttribute('aria-hidden', 'false'); }));
    visor.addEventListener('click', (event) => { if (event.target === visor || event.target.classList.contains('fechar')) { visor.classList.remove('aberto'); visor.setAttribute('aria-hidden', 'true'); } });
  </script>
</body>
</html>
